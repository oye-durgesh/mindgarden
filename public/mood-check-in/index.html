<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #140e22;
  }
</style>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas" />
</helmet>
<dc-import name="MoodCheckin" theme="dark" variant="full" hint-size="390px,844px"></dc-import>
</x-dc>
<script>
  window.addEventListener('click', function (event) {
    if (event.target.closest && event.target.closest('.ph-caret-left')) {
      window.parent.postMessage({ type: 'MINDGARDEN_MOOD_BACK' }, '*')
    }
  })
</script>
</body>
</html>
