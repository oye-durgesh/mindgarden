<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #140e22;
  }
  .stage {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }
  .stage dc-import,
  .stage > * {
    display: block;
    width: 100%;
    height: 100%;
  }
  .stage [style*="width:390px"] {
    width: 100% !important;
    height: 100% !important;
    border-radius: 0 !important;
    box-shadow: none !important;
  }
</style>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas" />
</helmet>
<div class="stage">
  <dc-import name="MoodCheckin" theme="dark" variant="full" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
</body>
</html>
